<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机播放器 5.8.1</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: #f9fafb;
      background: #111827;
      border: 1px solid #374151;
      font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
      -webkit-app-region: drag;
    }
    main { width: 100%; padding: 24px 28px 22px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 8px;
      animation: breathe 1.8s ease-in-out infinite;
    }
    h1 { margin: 0; font-size: 19px; line-height: 1.35; letter-spacing: 0; }
    .version { margin-top: 3px; color: #9ca3af; font-size: 12px; }
    .status-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; }
    #status { min-width: 0; overflow: hidden; color: #d1d5db; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    #percent { flex: 0 0 auto; color: #a7f3d0; font-variant-numeric: tabular-nums; font-size: 12px; }
    .track { width: 100%; height: 6px; margin-top: 8px; overflow: hidden; border-radius: 3px; background: #374151; }
    #progress { width: 0; height: 100%; border-radius: 3px; background: #22c55e; transition: width 220ms ease; }
    body.error #status, body.error #percent { color: #fca5a5; }
    body.error #progress { background: #ef4444; }
    @keyframes breathe { 0%, 100% { opacity: .78; transform: scale(.96); } 50% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .logo { animation: none; } #progress { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img class="logo" src="logo.png" alt="">
      <div>
        <h1>随机播放器 5.8.1</h1>
        <div class="version">正在准备本地视频库</div>
      </div>
    </div>
    <div class="status-row">
      <div id="status">启动中</div>
      <div id="percent">0%</div>
    </div>
    <div class="track" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progress"></div>
    </div>
  </main>
  <script src="splash.js"></script>
</body>
</html>
